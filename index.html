<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Viral</title>

  <!-- POPUNDER -->
  <script src="https://pl29581027.effectivecpmnetwork.com/4d/cc/6c/4dcc6c0e5e64226e4cb432f2f8e2c09e.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      min-height: 100%;
    }

    .video-container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    .info {
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 14px;
      padding: 12px;
    }
  </style>
</head>

<body>

  <div class="video-container">

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    >
      <source
        src="https://cdn2.videy.co/UBX0ULqN1.mp4"
        type="video/mp4"
      >

      Browser kamu tidak mendukung video HTML5.
    </video>

    <div class="info">
      Tonton video sampai 15 detik
    </div>

  </div>

  <script>

    const video = document.getElementById("videoPlayer");

    const directLink =
      "https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";

    let redirected = false;

    /*
     * Cek posisi video
     */
    video.addEventListener("timeupdate", function () {

      if (redirected) {
        return;
      }

      /*
       * Redirect ketika video mencapai 15 detik
       */
      if (video.currentTime >= 15) {

        redirected = true;

        video.pause();

        window.location.href = directLink;
      }

    });

  </script>

</body>
</html>
