    html,

    .video-container {
      width: 100%;

<body>

  <div class="video-container">

    <video
      id="videoPlayer"
      controls
      playsinline
      preload="metadata"
    >

      <source
        src="https://cdn2.videy.co/UBX0ULqN1.mp4"
        type="video/mp4"
      >

      Browser kamu tidak mendukung video HTML5.

    </video>

    <div class="info">
      Tonton video sampai 15 detik
    </div>

  </div>


  <script>

    const video = document.getElementById("videoPlayer");

    const directLink =
      "https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";

    let redirected = false;


    video.addEventListener("timeupdate", function () {

      if (redirected) {
        return;
      }

      if (video.currentTime >= 15) {

        redirected = true;

        video.pause();

        window.location.href = directLink;

      }

    });

  </script>
